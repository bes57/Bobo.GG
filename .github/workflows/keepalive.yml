name: Keep Render awake

# Pings the live site so Render's free tier never spins down (15-min idle timeout).
# Scheduled every 5 minutes — GitHub often runs cron jobs several minutes late,
# so the tight spacing guarantees a hit lands inside the idle window.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            https://bobo-gg.onrender.com/health)
          echo "Health check returned HTTP $code"
          test "$code" = "200"
